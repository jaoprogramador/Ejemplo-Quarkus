<p-table
  [value]="recetasFiltradas()"
  [paginator]="true"
  [rows]="5"
  class="p-datatable-striped shadow-1 border-round-sm overflow-hidden"
  [responsiveLayout]="'scroll'"
>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id" style="width: 10%">ID <p-sortIcon field="id"></p-sortIcon></th>
      <th pSortableColumn="nombre" style="width: 40%">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
      <th style="width: 15%">Tiempo</th>
      <th style="width: 15%">Dificultad</th>
      <th style="width: 20%; text-align: center">Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-receta>
    <tr>
      <td>{{ receta.id }}</td>
      <td><strong>{{ receta.nombre }}</strong></td>
      <td>{{ receta.tiempoPreparacion }} min</td>
      <td>{{ receta.dificultad }}</td>

      <td>
        <div class="flex justify-content-center gap-2">
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            severity="success"
            [text]="true"
            [routerLink]="['/recetas/editar', receta.id]"
            pTooltip="Editar"
            tooltipPosition="top"
          />

          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            severity="danger"
            [text]="true"
            (onClick)="eliminar(receta.id)"
            pTooltip="Eliminar"
            tooltipPosition="top"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" class="text-center p-5 text-secondary">
        <i class="pi pi-filter-slash mr-2"></i>
        No se encontraron recetas con ese ingrediente.
      </td>
    </tr>
  </ng-template>
</p-table>
