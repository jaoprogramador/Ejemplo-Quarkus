<p-table [value]="recetas()" [paginator]="true" [rows]="5" class="p-datatable-striped">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Tiempo</th>
      <th>Dificultad</th>
      <th style="width: 10rem">Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-receta>
    <tr>
      <td>{{ receta.id }}</td>
      <td>{{ receta.nombre }}</td>
      <td>{{ receta.tiempoPreparacion }} min</td>
      <td>{{ receta.dificultad }}</td>
      <td>
        <p-button
          icon="pi pi-pencil"
          [rounded]="true"
          severity="success"
          [text]="true"
          [routerLink]="['/recetas/editar', receta.id]" />

        <p-button
          icon="pi pi-trash"
          [rounded]="true"
          severity="danger"
          [text]="true"
          (onClick)="eliminar(receta.id)" />
      </td>
    </tr>
  </ng-template>
</p-table>
