quarkus.flyway.migrate-at-start=true
# 1. Si la tabla de historia no existe, Flyway "marcará" la BD actual como versión 1.0.0
quarkus.flyway.baseline-on-migrate=true
# 2. Indica qué versión es la actual de tu base de datos local
quarkus.flyway.baseline-version=1.0.0
# 3. Permite que Flyway ignore que las tablas ya están creadas al validar
quarkus.flyway.validate-on-migrate=false

#quarkus.http.port=8081
quarkus.datasource.db-kind = h2
quarkus.datasource.jdbc.url = jdbc:h2:./db
#para no perder los datos cada vez que creamos como con drop-and-create
#quarkus.hibernate-orm.database.generation = update
quarkus.hibernate-orm.database.generation = none

quarkus.datasource.username=sa
quarkus.datasource.password=